query PersonalAccessTokens {
  personalAccessTokens(orderBy: CREATED_AT_DESC) {
    nodes {
      rowId
      name
      tokenPrefix
      lastUsedAt
      expiresAt
      createdAt
      permission
      personalAccessTokenRepositories {
        totalCount
        nodes {
          refPatterns
          pathPatterns
          repository {
            rowId
            slug
            owner {
              username
            }
          }
        }
      }
    }
  }
}
