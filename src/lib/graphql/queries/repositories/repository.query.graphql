query Repository($rowId: UUID!) {
  repository(rowId: $rowId) {
    rowId
    name
    slug
    description
    visibility
    defaultBranch
    createdAt
    updatedAt
    owner {
      rowId
      username
      avatarUrl
    }
    organization {
      rowId
      idpOrganizationId
      avatarUrl
    }
    repositoryCollaborators {
      nodes {
        userId
        permission
        user {
          rowId
          username
          avatarUrl
        }
      }
    }
  }
}
