query RepositoryGraph($userId: UUID!, $organizationId: UUID) {
  # Paid tier gate for the org-wide polyrepo graph. Non-null, so when the viewer
  # is below the Pro tier the API throws GRAPH_TIER_REQUIRED and nulls the whole
  # response, and the page renders the upgrade prompt instead of the graph
  polyrepoGraphAccess
  repositories(
    filter: {
      or: [
        { ownerId: { equalTo: $userId } }
        { repositoryCollaborators: { some: { userId: { equalTo: $userId } } } }
        { organizationId: { equalTo: $organizationId } }
      ]
    }
    orderBy: NAME_ASC
  ) {
    nodes {
      rowId
      name
      slug
      description
      visibility
      owner {
        rowId
        username
      }
      organization {
        rowId
        idpOrganizationId
      }
      outgoingRelationships: repositoryRelationshipsBySourceRepositoryId {
        nodes {
          rowId
          confidence
          versionConstraint
          targetRepository {
            rowId
            name
            slug
            owner {
              username
            }
            organization {
              idpOrganizationId
            }
          }
          relationshipType {
            rowId
            name
            isDirected
          }
        }
      }
    }
  }
  repositoryRelationshipTypes(orderBy: NAME_ASC) {
    nodes {
      rowId
      name
      description
      isDirected
    }
  }
}
