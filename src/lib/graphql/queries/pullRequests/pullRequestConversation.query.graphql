# Page sizes are bounded to stay under the API's GraphQL Armor query-cost
# ceiling: each connection multiplies its per-node field cost by `first`, and
# both connections plus their nested author/reviewer relations sum together, so
# large values (the combined document 500s above ~85 total) exceed the ceiling
# and the panel fails to load. 50 each leaves ample margin. Proper pagination is
# the follow-up for conversations that exceed a page.
query PullRequestConversation($pullRequestId: UUID!) {
  pullRequestComments(
    condition: { pullRequestId: $pullRequestId }
    orderBy: [CREATED_AT_ASC]
    first: 50
  ) {
    nodes {
      id
      rowId
      pullRequestId
      authorId
      body
      path
      line
      side
      commitSha
      replyToId
      createdAt
      updatedAt
      author {
        rowId
        username
        avatarUrl
      }
    }
  }
  pullRequestReviews(
    condition: { pullRequestId: $pullRequestId }
    orderBy: [CREATED_AT_ASC]
    first: 50
  ) {
    nodes {
      id
      rowId
      pullRequestId
      reviewerId
      state
      body
      submittedAt
      createdAt
      updatedAt
      reviewer {
        rowId
        username
        avatarUrl
      }
    }
  }
}
